<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>젤리 물수제비 — 조창훈</title>
    <meta name="description" content="바다 위에 떠 있는 젤리를 눌러 던지면 물수제비처럼 튀어 나갑니다. Three.js로 만든 작은 놀이터." />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://www.cvcvcx9.org/play/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="조창훈 포트폴리오" />
    <meta property="og:title" content="젤리 물수제비 — 조창훈" />
    <meta property="og:url" content="https://www.cvcvcx9.org/play/" />
    <meta property="og:image" content="https://www.cvcvcx9.org/og.jpg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="play-page">
    <header class="nav is-scrolled" data-nav>
      <a class="nav__brand" href="/">
        <strong>조창훈</strong>
        <span>Backend Engineer</span>
      </a>
      <nav class="nav__links" aria-label="주요 섹션">
        <a href="/#agents">일하는 방식</a>
        <a href="/#flowlab">테스트 콘솔</a>
        <a href="/#earlier">이전 작업</a>
        <a href="/cases/">해결한 문제</a>
        <a href="/play/" class="is-active" aria-current="page">놀이터</a>
      </nav>
      <a class="nav__cta" href="/#contact">연락하기<span aria-hidden="true">→</span></a>
      <button class="nav__menu" type="button" aria-expanded="false" aria-controls="menu" data-menu-toggle>
        <span class="sr-only">메뉴 열기</span><i></i><i></i>
      </button>
    </header>

    <div class="menu" id="menu" hidden data-menu>
      <nav aria-label="모바일 메뉴">
        <a href="/#agents"><small>01</small>일하는 방식</a>
        <a href="/#flowlab"><small>02</small>테스트 콘솔</a>
        <a href="/#earlier"><small>03</small>이전 작업</a>
        <a href="/#contact"><small>04</small>연락</a>
        <a href="/cases/"><small>→</small>해결한 문제</a>
        <a href="/play/"><small>→</small>놀이터</a>
      </nav>
    </div>

    <main id="main" class="play">
      <canvas
        class="play__canvas"
        tabindex="0"
        data-play
        aria-label="바다 위에 떠 있는 젤리. 누르면 던지고, 누른 채 아래로 끌면 조준합니다. Space 키로도 던질 수 있습니다."
      ></canvas>
      <div class="play__pops" aria-hidden="true" data-pops></div>
      <div class="play__coach" aria-hidden="true" data-coach hidden>
        <span>눌러서 던지기 · 끌어서 조준</span>
      </div>

      <section class="play__panel">
        <p class="label label--small">놀이터</p>
        <h1 class="play__title">젤리 물수제비</h1>
        <p class="play__status" aria-live="polite" data-status></p>
        <dl class="play__score">
          <div><dt>이번</dt><dd data-skips>0</dd></div>
          <div><dt>최고</dt><dd data-best>0</dd></div>
        </dl>
        <div class="play__controls">
          <button type="button" class="play__btn" data-sound aria-pressed="true">소리 켬</button>
          <button type="button" class="play__btn" data-reset>불러오기</button>
        </div>
        <p class="play__keys">Space 던지기 · R 불러오기 · 낮고 빠를수록 많이 튑니다</p>
      </section>

      <p class="play__fallback" hidden data-fallback>이 브라우저에서는 WebGL을 쓸 수 없어 놀이터를 열 수 없습니다.</p>
    </main>

    <script type="module" src="/src/play/main.ts"></script>
  </body>
</html>
